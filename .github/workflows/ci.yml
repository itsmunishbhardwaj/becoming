name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/angular-migration]

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx ng test --watch=false --no-progress

      - name: Build
        run: npx ng build --configuration=production
