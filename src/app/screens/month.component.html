@if (!goalsLoaded()) {
  <div class="month-loading">
    <p>Reading your vault…</p>
  </div>
} @else {
  <div class="month-page"
       (touchstart)="onTouchStart($event)"
       (touchend)="onTouchEnd($event)"
       (pointerdown)="onPointerDown($event)"
       (pointermove)="onPointerMove($event)"
       (pointerup)="onPinchEnd($event)"
       (pointercancel)="onPinchEnd($event)"
       (click)="viewSwitcherOpen() && toggleViewSwitcher()">

    <div class="month-shell">

      <!-- Header row: nav arrows + view dropdown -->
      <header class="month-header">
        <div class="month-nav" aria-label="Month navigation">
          <button type="button" class="month-nav-btn" (click)="navigate(-1)" aria-label="Previous month">‹</button>
          <button type="button" class="month-nav-btn" (click)="navigate(1)"  aria-label="Next month">›</button>
        </div>

        <div class="view-switcher-wrap">
          <button class="view-switcher-btn" (click)="toggleViewSwitcher(); $event.stopPropagation()">
            Month
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none" class="chevron">
              <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          @if (viewSwitcherOpen()) {
            <div class="view-dropdown" (click)="$event.stopPropagation()">
              <button class="view-option" (click)="goToDay()">Day</button>
              <button class="view-option" (click)="goToWeekView()">Week</button>
              <button class="view-option view-option--active">Month</button>
              <button class="view-option" (click)="goToCalendar()">Year</button>
            </div>
          }
        </div>
      </header>

      <!-- Month title -->
      <div class="month-title-row">
        <h1 class="month-h1" [class]="slideClass()">{{ monthName }}</h1>
        <span class="month-kicker">{{ year() }}</span>
      </div>

      <!-- Pen chips -->
      @if (goals().length > 0) {
        <app-pen-chips
          [goals]="goals()"
          [penId]="penId()"
          [penDayCount]="penDayCount"
          (pick)="onPenPick($event)"
        />
      }

      <!-- Month block -->
      <app-month-block
        [year]="year()"
        [monthIdx]="monthIdx()"
        [goals]="goals()"
        [adherenceMaps]="adherenceMaps()"
        [focus]="pen()"
        [pen]="pen()"
        [todayISO]="todayISO"
        [showHalo]="false"
        [blobScale]="1.6"
        [projectedDates]="projectedSet()"
        [showWeekPills]="false"
        (dayTap)="onDayTap($event)"
        (dayOpen)="onDayOpen($event)"
        (monthOpen)="onMonthOpen($event)"
        (weekPillClick)="onWeekPillClick($event)"
      />

    </div>
  </div>
}
