<div class="quick-create-page">
  <header class="form-header">
    <span class="kicker">New goal</span>
    <h1 class="h1">Name it. Track it.</h1>
    <p class="tagline">Start now — you can always refine later.</p>
  </header>

  <form class="create-form" (ngSubmit)="onSubmit()" #f="ngForm">

    <!-- Goal name -->
    <div class="field">
      <label class="field-label" for="goal-name">Goal name</label>
      <input
        id="goal-name"
        class="field-input"
        type="text"
        placeholder="e.g. Ship side project, Run a 10K"
        autofocus
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        name="goalName"
      />
    </div>

    <!-- Category -->
    <div class="field">
      <label class="field-label" for="goal-cat">Category</label>
      <select
        id="goal-cat"
        class="field-input"
        [ngModel]="cat()"
        (ngModelChange)="cat.set($event)"
        name="goalCat"
      >
        @for (key of catKeys; track key) {
          <option [value]="key">{{ CATS[key].name }}</option>
        }
      </select>
    </div>

    <!-- Color picker -->
    <div class="field">
      <span class="field-label">Color</span>
      <div class="color-picker-row">
        <button type="button" class="color-preview-btn" (click)="wheelOpen.set(true)">
          <span class="color-preview-dot" [style.background]="previewColor()"></span>
          <span>{{ colorMode() === 'auto' ? 'Auto' : 'Custom' }}</span>
          <span class="color-preview-change">Change →</span>
        </button>
      </div>
    </div>

    @if (wheelOpen()) {
      <app-color-wheel
        [value]="previewColor()"
        (colorChange)="selectColor($event)"
        (closed)="wheelOpen.set(false)"
      />
    }

    <!-- End date -->
    <div class="field">
      <label class="field-label" for="goal-end">End date</label>
      <input
        id="goal-end"
        class="field-input"
        type="date"
        [ngModel]="endDate()"
        (ngModelChange)="endDate.set($event)"
        name="goalEnd"
      />
    </div>

    <!-- Time of day (optional) -->
    <div class="field">
      <label class="field-label" for="goal-time">
        Time of day <span class="field-hint">(optional)</span>
      </label>
      <input
        id="goal-time"
        class="field-input"
        type="time"
        [ngModel]="goalTime()"
        (ngModelChange)="goalTime.set($event)"
        name="goalTime"
      />
      <span class="field-hint-block">When you plan to work on this daily.</span>
    </div>

    <!-- Ambition -->
    <div class="field">
      <label class="field-label" for="goal-ambition">
        Ambition <span class="field-hint">(optional)</span>
      </label>
      <textarea
        id="goal-ambition"
        class="field-input field-input--textarea"
        rows="3"
        placeholder="Why does this matter to you?"
        [ngModel]="ambition()"
        (ngModelChange)="ambition.set($event)"
        name="goalAmbition"
      ></textarea>
    </div>

    @if (error()) {
      <p class="error-msg">{{ error() }}</p>
    }

    <div class="submit-row">
      <button type="submit" class="primary-pill" [disabled]="saving()">
        {{ saving() ? 'Creating…' : 'Create goal' }}
      </button>
    </div>

  </form>
</div>
