<div class="signin-page">
  <div class="grain-overlay" aria-hidden="true"></div>
  <div class="vellum-mist" aria-hidden="true"></div>

  <div class="wordmark-section">
    <div class="wordmark">Becoming</div>
    <div class="tagline">Your life, in motion</div>
  </div>

  <div class="form-box">
    @if (confirm()) {
      <p class="confirm-msg">Check your email to confirm your account, then sign in.</p>
    } @else {
      <form class="email-form" (ngSubmit)="onEmailSubmit()" #f="ngForm">
        <input
          class="email-input"
          type="email"
          autocomplete="email"
          placeholder="Email"
          required
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          [disabled]="loading()"
          aria-label="Email address"
        />
        <input
          class="password-input"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          required
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          [disabled]="loading()"
          aria-label="Password"
        />
        <button
          class="primary-btn"
          type="submit"
          [disabled]="loading()"
        >
          {{ loading() ? '…' : (mode() === 'signin' ? 'Sign in' : 'Create account') }}
        </button>
      </form>

      <button class="mode-toggle" type="button" (click)="toggleMode()">
        @if (mode() === 'signin') {
          No account? <span>Create one</span>
        } @else {
          Already have one? <span>Sign in</span>
        }
      </button>

      <div class="divider" role="separator">
        <span class="divider-line"></span>
        <span class="divider-text">or</span>
        <span class="divider-line"></span>
      </div>

      <button class="google-btn" type="button" (click)="onGoogle()" [disabled]="loading()" aria-label="Sign in with Google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>
    }

    <button class="guest-btn" type="button" (click)="onGuest()" [disabled]="loading()">
      Continue as guest
    </button>

    @if (err()) {
      <p class="error-msg" role="alert">{{ err() }}</p>
    }
  </div>
</div>
