@if (!goalsLoaded()) {
  <div class="week-loading">
    <p>Reading your vault…</p>
  </div>
} @else {
  <div class="week-page"
       (touchstart)="onTouchStart($event)"
       (touchend)="onTouchEnd($event)"
       (pointerdown)="onPointerDown($event)"
       (pointermove)="onPointerMove($event)"
       (pointerup)="onPinchEnd($event)"
       (pointercancel)="onPinchEnd($event)"
       (click)="viewSwitcherOpen() && toggleViewSwitcher()">

    <div class="week-shell">

      <!-- Header row: nav arrows + view dropdown -->
      <header class="week-header">
        <div class="week-nav" aria-label="Week navigation">
          <button type="button" class="week-nav-btn" (click)="navigate(-1)" aria-label="Previous week">‹</button>
          <button type="button" class="week-nav-btn" (click)="navigate(1)"  aria-label="Next week">›</button>
        </div>

        <div class="view-switcher-wrap">
          <button class="view-switcher-btn" (click)="toggleViewSwitcher(); $event.stopPropagation()">
            Week
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none" class="chevron">
              <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          @if (viewSwitcherOpen()) {
            <div class="view-dropdown" (click)="$event.stopPropagation()">
              <button class="view-option" (click)="goToDay()">Day</button>
              <button class="view-option view-option--active">Week</button>
              <button class="view-option" (click)="goToMonth()">Month</button>
              <button class="view-option" (click)="goToCalendar()">Year</button>
            </div>
          }
        </div>
      </header>

      <!-- Kicker + title -->
      <div class="week-title-row">
        <span class="week-kicker">WEEK OF</span>
        <h1 class="week-h1">{{ weekLabel() }}</h1>
      </div>

      <!-- Pen chips -->
      @if (goals().length > 0) {
        <app-pen-chips
          [goals]="goals()"
          [penId]="penId()"
          [penDayCount]="penDayCount"
          (pick)="onPenPick($event)"
        />
      }

      <!-- 7-column day grid -->
      <div class="week-days" [class]="slideClass()">
        @for (day of days(); track day.iso) {
          <div class="week-day" [attr.data-day-iso]="day.iso">
            <span class="week-day-head">{{ day.letter }}</span>
            <span class="week-day-num" [class.today]="day.iso === todayISO">{{ day.num }}</span>
            <div class="week-cell">
              <app-day-cell
                [isoDate]="day.iso"
                [goals]="goals()"
                [adherenceMaps]="adherenceMaps()"
                [focus]="pen()"
                [pen]="pen()"
                [isToday]="day.iso === todayISO"
                [showHalo]="false"
                [blobScale]="1.4"
                [hideDayNumber]="true"
                [projectedDates]="projectedSet() ?? emptySet"
                (toggle)="onDayTap(day.iso)"
                (open)="onDayOpen(day.iso)"
              />
            </div>
          </div>
        }
      </div>

    </div>
  </div>
}
