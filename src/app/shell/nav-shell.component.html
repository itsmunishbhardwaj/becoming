@if (desktop()) {
  <nav class="top-nav">
    <a routerLink="/year" class="logo">Becoming</a>
    <div class="top-tabs">
      @for (tab of tabs; track tab.path) {
        <a [routerLink]="tab.path" routerLinkActive="top-tab--active" class="top-tab">
          {{ tab.label }}
        </a>
      }
    </div>
    <div class="profile-wrap">
      <button class="profile-btn" (click)="profileOpen.set(!profileOpen())" [attr.aria-expanded]="profileOpen()">
        <span class="profile-initial">{{ userInitial() }}</span>
      </button>
      @if (profileOpen()) {
        <div class="profile-dropdown">
          @if (isGuest()) {
            <div class="profile-info">Signed in as guest</div>
            <a routerLink="/signin" class="profile-item" (click)="profileOpen.set(false)">Create account</a>
          } @else {
            <div class="profile-info">{{ auth.session()?.user?.email }}</div>
          }
          <button class="profile-item profile-item--danger" (click)="signOut()">Sign out</button>
        </div>
        <div class="profile-backdrop" (click)="profileOpen.set(false)"></div>
      }
    </div>
  </nav>
  <main class="content content--top">
    <router-outlet />
  </main>
} @else {
  <main class="content content--bottom">
    <router-outlet />
  </main>
  <nav class="bottom-nav">
    @for (tab of tabs; track tab.path) {
      <a [routerLink]="tab.path" routerLinkActive="bottom-tab--active" class="bottom-tab">
        <span class="bottom-label">{{ tab.short }}</span>
      </a>
    }
  </nav>
}
